# Nami default key bindings — IINA's defaults, with macOS Command mapped to Ctrl.
# This file ships with the app and is loaded first; input.conf in the Nami mpv
# config folder (Preferences > mpv configuration) is loaded on top and overrides it.
# Bindings marked "app" are handled by Nami itself and listed here only for reference.

Ctrl+Alt+v cycle video
Ctrl+Alt+s cycle sub
Ctrl+Alt+a cycle audio

SPACE cycle pause
Ctrl+. stop

RIGHT seek  5
LEFT  seek -5
Alt+RIGHT frame-step
Alt+LEFT frame-back-step

Shift+LEFT   sub-seek -1
Shift+RIGHT  sub-seek  1

Ctrl+s screenshot

Ctrl+l ab-loop
Ctrl+L cycle-values loop "inf" "no"

Ctrl+RIGHT playlist-next
Ctrl+LEFT playlist-prev

Ctrl+Shift+> add chapter 1
Ctrl+Shift+< add chapter -1

Ctrl+[ multiply speed 0.5
Ctrl+] multiply speed 2.0
Ctrl+Alt+[ multiply speed 1/1.1
Ctrl+Alt+] multiply speed 1.1
Ctrl+\ set speed 1.0

# app: Ctrl+0 / Ctrl+1 / Ctrl+2  window at half / actual / double size
# app: Ctrl+3                    fit the window to the screen
# app: Ctrl+-  / Ctrl+=          smaller / bigger window
# app: Ctrl+Shift+v / a / s      video / audio / subtitle panel
# app: Ctrl+Shift+p              playlist panel
# app: Ctrl+Shift+c              chapters panel
# app: Ctrl+Alt+p                mini player
# app: Ctrl+Alt+m                music mode
# app: Ctrl+Shift+r              show the current file in Explorer
# app: Ctrl+d                    find online subtitles

Ctrl+Alt+f cycle fullscreen
Ctrl+Alt+t cycle ontop

UP    add volume 5
DOWN  add volume -5
Alt+UP add volume 1
Alt+DOWN add volume -1

Ctrl+/ cycle mute

Shift+( add audio-delay 0.5
Shift+) add audio-delay -0.5
Alt+Shift+( add audio-delay 0.1
Alt+Shift+) add audio-delay -0.1
Shift+_ set audio-delay 0

Z add sub-delay -0.5
X add sub-delay 0.5
Alt+Z add sub-delay -0.1
Alt+X add sub-delay 0.1
C set sub-delay 0

ESC set fullscreen no
ENTER set fullscreen yes


# Alternative mpv key bindings

q quit

p cycle pause                          # toggle pause/playback mode

. frame-step                           # advance one frame and pause
, frame-back-step                      # go back by one frame and pause

m cycle mute

Shift+PGUP seek 600
Shift+PGDWN seek -600

G add sub-scale +0.1                   # increase the subtitle font size
F add sub-scale -0.1                   # decrease the subtitle font size

r add sub-pos -1
R add sub-pos +1
t add sub-pos +1
v cycle sub-visibility                 # hide or show the subtitles
Alt+v cycle secondary-sub-visibility   # hide or show the secondary subtitles

f cycle fullscreen                     # toggle fullscreen

E cycle edition                        # next edition

POWER quit
PLAY cycle pause
PAUSE cycle pause
PLAYPAUSE cycle pause
STOP stop
FORWARD seek 15
REWIND seek -15
NEXT playlist-next
PREV playlist-prev
VOLUME_UP add volume 2
VOLUME_DOWN add volume -2
MUTE cycle mute
CLOSE_WIN quit
